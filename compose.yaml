services:
  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
      LDAP_SEED_INTERNAL_LDIF_PATH: /container/service/slapd/assets/config/bootstrap/ldif/custom
    volumes:
      - ./docker/ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -H ldap://localhost:389 -x -D 'cn=admin,dc=example,dc=org' -w admin"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
    environment:
      LDAP_URL: ldap://ldap:389
      LDAP_BASE_DN: ou=people,dc=example,dc=org
      LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LDAP_BIND_PASSWORD: admin
      SERVICE_ADDRESS: http://0.0.0.0:8080/auth
    depends_on:
      ldap:
        condition: service_healthy
    ports:
      - "8080:8080"