services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-password}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 15

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -H ldap://localhost:389 -x -D 'cn=admin,dc=example,dc=org' -w admin"]
      interval: 5s
      timeout: 5s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-password}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - ./docker/keycloak/mfa-realm.json:/opt/keycloak/data/import/mfa-realm.json:ro
      - ./docker/keycloak/themes/mfa-secure:/opt/keycloak/themes/mfa-secure:ro
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "8081:8080"

  ldap-init:
    image: osixia/openldap:1.5.0
    volumes:
      - ./docker/ldap/bootstrap/01-users.ldif:/bootstrap/01-users.ldif:ro
    depends_on:
      ldap:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ldapsearch -LLL -H ldap://ldap:389 -x
        -D cn=admin,dc=example,dc=org -w admin
        -b ou=people,dc=example,dc=org '(uid=alice)' dn | grep -q '^dn:' ||
        ldapadd -H ldap://ldap:389 -x
        -D cn=admin,dc=example,dc=org -w admin
        -f /bootstrap/01-users.ldif

  backend:
    build:
      context: .
    environment:
      LDAP_URL: ldap://ldap:389
      LDAP_BASE_DN: ou=people,dc=example,dc=org
      LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LDAP_BIND_PASSWORD: admin
      SERVICE_ADDRESS: http://0.0.0.0:8080/auth
    depends_on:
      ldap-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      SOAP_URL: http://backend:8080/auth
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-704c387d-9d76-4614-8071-ec85c545106b}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-1870159c-68b8-4797-aa60-196841d39d07}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:3000/auth/callback}
      ENTRA_WORKFORCE_TENANT_ID: ${ENTRA_WORKFORCE_TENANT_ID:-}
      ENTRA_WORKFORCE_CLIENT_ID: ${ENTRA_WORKFORCE_CLIENT_ID:-}
      ENTRA_WORKFORCE_CLIENT_SECRET: ${ENTRA_WORKFORCE_CLIENT_SECRET:-}
      ENTRA_WORKFORCE_AUTHORITY: ${ENTRA_WORKFORCE_AUTHORITY:-}
      ENTRA_WORKFORCE_REDIRECT_URI: ${ENTRA_WORKFORCE_REDIRECT_URI:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8081/realms/mfa}
      KEYCLOAK_INTERNAL_ORIGIN: http://keycloak:8080
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-mfa-frontend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-mfa-local-client-secret}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-http://localhost:3000/auth/customer/callback}
      KEYCLOAK_POST_LOGOUT_REDIRECT_URI: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  keycloak-data: