services:
  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -H ldap://localhost:389 -x -D 'cn=admin,dc=example,dc=org' -w admin"]
      interval: 5s
      timeout: 5s
      retries: 15

  ldap-init:
    image: osixia/openldap:1.5.0
    volumes:
      - ./docker/ldap/bootstrap/01-users.ldif:/bootstrap/01-users.ldif:ro
    depends_on:
      ldap:
        condition: service_healthy
    entrypoint: ["ldapadd"]
    command: ["-H", "ldap://ldap:389", "-x", "-D", "cn=admin,dc=example,dc=org", "-w", "admin", "-f", "/bootstrap/01-users.ldif"]

  backend:
    build:
      context: .
    environment:
      LDAP_URL: ldap://ldap:389
      LDAP_BASE_DN: ou=people,dc=example,dc=org
      LDAP_BIND_DN: cn=admin,dc=example,dc=org
      LDAP_BIND_PASSWORD: admin
      SERVICE_ADDRESS: http://0.0.0.0:8080/auth
    depends_on:
      ldap-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      SOAP_URL: http://backend:8080/auth
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-704c387d-9d76-4614-8071-ec85c545106b}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-1870159c-68b8-4797-aa60-196841d39d07}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-http://localhost:3000/auth/callback}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"