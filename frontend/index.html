<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de acceso</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17221c;
      --muted: #647268;
      --paper: #f3f0e8;
      --panel: #fffdf8;
      --accent: #d35432;
      --accent-dark: #9e3821;
      --line: #d9ddd1;
      --success: #287052;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, 'Times New Roman', serif;
    }
    .shell { min-height: 100vh; display: grid; grid-template-columns: minmax(280px, 0.85fr) minmax(320px, 1.15fr); }
    .intro { padding: clamp(2rem, 7vw, 7rem); display: flex; flex-direction: column; justify-content: space-between; background: #dfe6d8; }
    .eyebrow { color: var(--accent-dark); font: 700 0.76rem/1.2 Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { max-width: 10ch; margin: 1.5rem 0; font-size: clamp(3rem, 7vw, 6.5rem); line-height: 0.9; font-weight: 400; }
    .intro p { max-width: 28rem; margin: 0; color: var(--muted); font: 1rem/1.6 Arial, sans-serif; }
    .mark { width: 4rem; height: 4rem; display: grid; place-items: center; border: 1px solid var(--ink); border-radius: 50%; font-size: 1.6rem; }
    .workspace { display: grid; place-items: center; padding: 2rem; background: var(--panel); }
    .card { width: min(100%, 30rem); max-width: 30rem; }
    .card h2 { margin: 0 0 0.6rem; font-size: 2rem; font-weight: 400; }
    .card > p { margin: 0 0 2rem; color: var(--muted); font: 0.95rem/1.5 Arial, sans-serif; }
    label { display: block; margin: 1.1rem 0 0.45rem; color: var(--muted); font: 700 0.76rem/1.2 Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    input { width: 100%; padding: 0.9rem 0; border: 0; border-bottom: 1px solid var(--line); outline: 0; color: var(--ink); background: transparent; font: 1.1rem Georgia, serif; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; margin-top: 2rem; padding: 1rem; border: 0; color: #fffdf8; background: var(--accent); cursor: pointer; font: 700 0.82rem Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .entra { display: block; width: 100%; margin-top: 1rem; padding: 1rem; border: 1px solid var(--ink); color: var(--ink); background: transparent; text-align: center; text-decoration: none; font: 700 0.82rem Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .entra:hover { color: #fffdf8; background: var(--ink); }
    .divider { display: flex; align-items: center; gap: 0.8rem; margin-top: 1.5rem; color: var(--muted); font: 0.75rem Arial, sans-serif; text-transform: uppercase; }
    .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
    .message { min-height: 1.4rem; margin-top: 1rem; color: var(--accent-dark); font: 0.9rem/1.4 Arial, sans-serif; }
    .profile { display: none; }
    .profile.visible { display: block; }
    .profile-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .avatar { width: 4rem; height: 4rem; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--success); font-size: 1.5rem; }
    .profile h2 { margin: 0; }
    .status { margin: 0.35rem 0 0; color: var(--success); font: 700 0.75rem Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .details { border-top: 1px solid var(--line); }
    .detail { display: flex; justify-content: space-between; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--line); font: 0.95rem Arial, sans-serif; }
    .detail span:first-child { color: var(--muted); }
    .back { margin-top: 2rem; color: var(--accent-dark); background: transparent; border: 1px solid var(--line); }
    @media (max-width: 720px) { .shell { grid-template-columns: 1fr; } .intro { min-height: 38vh; padding: 2rem; } h1 { margin: 1rem 0; font-size: clamp(3.5rem, 18vw, 6rem); } .workspace { padding: 3rem 1.5rem; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="intro">
      <div class="mark" aria-hidden="true">M</div>
      <div>
        <div class="eyebrow">Acceso seguro</div>
        <h1>Tu espacio, listo.</h1>
        <p>Valida tus credenciales contra el directorio corporativo y continúa a tu perfil.</p>
      </div>
    </section>
    <section class="workspace">
      <div class="card">
        <div id="login-view">
          <h2>Iniciar sesión</h2>
          <p>Usa tu directorio local o continúa con tu cuenta corporativa.</p>
          <form id="login-form">
            <label for="user">Usuario</label>
            <input id="user" name="user" autocomplete="username" required>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="submit" type="submit">Entrar</button>
            <div class="message" id="message" role="alert"></div>
          </form>
          <div class="divider">o</div>
          <a class="entra" href="/auth/entra/login">Continuar con Microsoft</a>
        </div>
        <div id="profile-view" class="profile">
          <div class="profile-header">
            <div class="avatar" id="avatar"></div>
            <div><h2 id="profile-name"></h2><p class="status">Autenticación confirmada</p></div>
          </div>
          <div class="details">
            <div class="detail"><span>Usuario</span><strong id="profile-user"></strong></div>
            <div class="detail"><span>Autenticado contra</span><strong id="profile-provider"></strong></div>
            <div class="detail"><span>Estado</span><strong>Activo</strong></div>
          </div>
          <button class="back" id="logout" type="button">Cerrar sesión</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const submit = document.querySelector('#submit');
    const message = document.querySelector('#message');
    const loginView = document.querySelector('#login-view');
    const profileView = document.querySelector('#profile-view');
    function showProfile(user, provider, name = user) {
      document.querySelector('#avatar').textContent = (name || user).charAt(0).toUpperCase();
      document.querySelector('#profile-name').textContent = `Hola, ${name || user}`;
      document.querySelector('#profile-user').textContent = user;
      document.querySelector('#profile-provider').textContent = provider;
      loginView.style.display = 'none';
      profileView.classList.add('visible');
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      submit.disabled = true;
      message.textContent = 'Validando...';
      const user = document.querySelector('#user').value.trim();
      const password = document.querySelector('#password').value;
      try {
        const response = await fetch('/api/authenticate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, password }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message);
        if (!result.authenticated) throw new Error('Usuario o contraseña incorrectos.');
        showProfile(user, result.provider);
      } catch (error) { message.textContent = error.message; }
      finally { submit.disabled = false; }
    });
    document.querySelector('#logout').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      profileView.classList.remove('visible');
      loginView.style.display = '';
      form.reset();
      message.textContent = '';
    });
    fetch('/api/me').then(response => response.ok ? response.json() : null).then(user => {
      if (user?.authenticated) showProfile(user.username, user.provider, user.name);
    });
  </script>
</body>
</html>
